<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{
  --bg:#eef1f5;--surface:#fff;--text:#14202b;--muted:#6b7a88;
  --key:#e3e8ee;--key-text:#14202b;--op:#0f7b8f;--op-text:#fff;--eq:#14202b;--eq-text:#fff;--focus:#0f7b8f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161c;--surface:#18212a;--text:#e8eef3;--muted:#8fa1b0;
    --key:#263340;--key-text:#e8eef3;--op:#3bb3c9;--op-text:#08222a;--eq:#e8eef3;--eq-text:#10161c;--focus:#3bb3c9;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c;--surface:#18212a;--text:#e8eef3;--muted:#8fa1b0;
  --key:#263340;--key-text:#e8eef3;--op:#3bb3c9;--op-text:#08222a;--eq:#e8eef3;--eq-text:#10161c;--focus:#3bb3c9;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.calc{width:100%;max-width:340px;background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.screen{text-align:right;padding:10px 6px 16px;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end}
#expr{color:var(--muted);font-size:15px;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cur{font-size:44px;font-weight:600;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
#cur.long{font-size:30px}
#cur.err{font-size:20px;white-space:normal}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:22px;height:62px;border:0;border-radius:16px;background:var(--key);color:var(--key-text);cursor:pointer}
button:active{filter:brightness(.92)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button.op{background:var(--op);color:var(--op-text)}
button.eq{background:var(--eq);color:var(--eq-text)}
</style>
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div id="expr"></div>
    <div id="cur">0</div>
  </div>
  <div class="keys" id="keys">
    <button data-k="C" aria-label="Clear">C</button>
    <button data-k="Backspace" aria-label="Delete last digit">⌫</button>
    <button data-k="%" aria-label="Percent">%</button>
    <button class="op" data-k="÷" aria-label="Divide">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="×" aria-label="Multiply">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="−" aria-label="Subtract">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>
    <button data-k="±" aria-label="Change sign">±</button>
    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=" aria-label="Equals">=</button>
  </div>
</main>
<script>
var cur="0",prev=null,op=null,fresh=false,err=false,expr="";
var curEl=document.getElementById("cur"),exprEl=document.getElementById("expr");

function fmt(n){return String(parseFloat(n.toPrecision(12)));}
function calc(a,b,o){
  a=parseFloat(a);b=parseFloat(b);
  if(o==="+")return a+b;
  if(o==="−")return a-b;
  if(o==="×")return a*b;
  return b===0?null:a/b;
}
function render(){
  curEl.textContent=cur;
  exprEl.textContent=expr;
  curEl.className=err?"err":(cur.length>10?"long":"");
}
function reset(){cur="0";prev=null;op=null;fresh=false;err=false;expr="";}
function fail(){reset();cur="Can’t divide by zero";err=true;fresh=true;render();}
function digit(d){
  if(err)reset();
  if(fresh){cur="0";fresh=false;}
  if(cur==="0")cur=d;else if(cur.length<15)cur+=d;
}
function dot(){
  if(err)reset();
  if(fresh){cur="0";fresh=false;}
  if(cur.indexOf(".")<0)cur+=".";
}
function operate(o){
  if(err)return;
  if(op&&!fresh){
    var r=calc(prev,cur,op);
    if(r===null)return fail();
    cur=fmt(r);
  }
  prev=cur;op=o;fresh=true;expr=cur+" "+o;
}
function equals(){
  if(err||!op)return;
  var r=calc(prev,cur,op);
  if(r===null)return fail();
  expr=prev+" "+op+" "+cur+" =";
  cur=fmt(r);op=null;prev=null;fresh=true;
}
function press(k){
  if(k>="0"&&k<="9"&&k.length===1)digit(k);
  else if(k===".")dot();
  else if(k==="+"||k==="−"||k==="×"||k==="÷")operate(k);
  else if(k==="=")equals();
  else if(k==="C")reset();
  else if(k==="Backspace"){
    if(err)reset();
    else if(!fresh)cur=(cur.length>1&&!(cur.length===2&&cur[0]==="-"))?cur.slice(0,-1):"0";
  }
  else if(k==="%"){if(!err){cur=fmt(parseFloat(cur)/100);fresh=true;}}
  else if(k==="±"){if(!err&&cur!=="0")cur=cur[0]==="-"?cur.slice(1):"-"+cur;}
  render();
}
document.getElementById("keys").addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(b)press(b.getAttribute("data-k"));
});
var keyMap={"*":"×","/":"÷","-":"−","Enter":"=","Delete":"C","Escape":"C",",":"."};
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=keyMap[e.key]||e.key;
  if(/^[0-9.+−×÷=%]$/.test(k)||k==="Backspace"||k==="C"){
    if(e.key==="Enter"||e.key==="/")e.preventDefault();
    press(k);
  }
});
render();
</script>
</body>
</html>
